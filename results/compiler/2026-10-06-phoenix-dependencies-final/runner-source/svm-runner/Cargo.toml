[package]
name = "gosvm-svm-runner"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
litesvm = "=0.8.2"
agave-feature-set = "~3.0"
solana-account = "~3.0"
solana-clock = { version = "~3.0", features = ["serde"] }
solana-rent = { version = "~3.0", features = ["serde"] }
solana-pubkey = "~3.0"
solana-transaction = { version = "=3.0.1", features = ["bincode", "serde"] }
solana-transaction-error = { version = "~3.0", features = ["serde"] }
base64 = "0.22"
bincode = "1.3"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
strip = true

[patch.crates-io]
# Preserve instruction errors before post-execution rent validation.
# Source/provenance and the single local patch are retained in third_party.
litesvm = { path = "../../third_party/litesvm-0.8.2" }
