[package]
name = "gosvm-svm-runner"
version = "0.6.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.13.0"
agave-feature-set = "=4.0.0"
solana-account = "=3.4.0"
solana-clock = { version = "=3.0.1", features = ["serde"] }
solana-rent = { version = "=3.1.0", features = ["serde"] }
solana-address = { version = "=2.2.0", features = ["std", "serde", "decode"] }
solana-transaction = { version = "=3.1.0", features = ["bincode", "serde"] }
solana-transaction-error = { version = "=3.1.0", features = ["serde"] }
base64 = "0.22"
bincode = "1.3"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
strip = true

[patch.crates-io]
# Reconstructed from a content-pinned archive by scripts/build_modern_runner.py.
litesvm = { path = "../../build/modern-runtime-vendor/litesvm-0.13.0" }
